name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rubocop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - bareruby-stdlib
    name: rubocop (${{ matrix.gem }})
    defaults:
      run:
        working-directory: gems/${{ matrix.gem }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: bundle install
      - run: bundle exec rubocop

  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - bareruby-stdlib
    name: rspec (${{ matrix.gem }})
    defaults:
      run:
        working-directory: gems/${{ matrix.gem }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: bundle install
      - run: bundle exec rspec
